name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Syntax and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check dev.js && node --check ink.js && node --check page.js

      # Stroke replay, the link format, and the dev server's refusals.
      # No dependencies: node:test and a fake canvas.
      - name: Run tests
        run: node --test
